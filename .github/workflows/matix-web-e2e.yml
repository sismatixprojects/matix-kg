name: MatixBridge web client e2e

# Builds the MatixBridge web client and runs it against a real, unmodified RustDesk peer on a
# virtual X display, through our own hbbs/hbbr: protocol smoke test, file transfer, and a
# headless-Chromium check that video decodes and keyboard/mouse input reaches the peer.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "matix/**"
      - ".github/workflows/matix-web-e2e.yml"
  push:
    branches: [master, "matix/**"]
    paths:
      - "matix/**"
      - ".github/workflows/matix-web-e2e.yml"

permissions:
  contents: read

env:
  RUSTDESK_VERSION: "1.5.3"
  SERVER_VERSION: "1.1.16"

jobs:
  server:
    # hbbs with matix/server/hbbs/agents-only.patch, built static (musl) like upstream's release,
    # so the same binary runs on the production box. The Linux e2e below runs against it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: matix/server/hbbs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk-server
          ref: ${{ env.SERVER_VERSION }}
          path: rustdesk-server
          submodules: recursive
      - name: Apply the agents-only patch
        working-directory: rustdesk-server
        run: git apply --verbose ../matix/server/hbbs/agents-only.patch
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rustdesk-server
      - name: Build hbbs/hbbr (x86_64-unknown-linux-musl)
        working-directory: rustdesk-server
        run: |
          cargo install cross --locked --version 0.2.5
          cross build --release --all-features --target x86_64-unknown-linux-musl --bin hbbs --bin hbbr
          mkdir -p ../out
          cp target/x86_64-unknown-linux-musl/release/hbbs target/x86_64-unknown-linux-musl/release/hbbr ../out/
          file ../out/*
          (cd ../out && sha256sum hbbs hbbr | tee SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matixbridge-server
          path: out/

  e2e:
    needs: server
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: matix/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matix/web/package-lock.json

      - name: Install and build the web client
        run: |
          npm ci
          npm run build
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Install peer (RustDesk ${{ env.RUSTDESK_VERSION }}) and servers
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb xterm openbox unzip dbus-x11 libgl1-mesa-dri libegl1 libgles2
          curl -fsSL -o rustdesk.deb "https://github.com/rustdesk/rustdesk/releases/download/${RUSTDESK_VERSION}/rustdesk-${RUSTDESK_VERSION}-x86_64.deb"
          sudo apt-get install -y ./rustdesk.deb
          # The package starts a root service that manages (and kills) --server processes;
          # we run the peer ourselves on the virtual display instead.
          sudo systemctl disable --now rustdesk || true
          sudo pkill -f "rustdesk --service" || true
          curl -fsSL -o server.zip "https://github.com/rustdesk/rustdesk-server/releases/download/${SERVER_VERSION}/rustdesk-server-linux-amd64.zip"
          unzip -o -q server.zip
          ls -R | head -20

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: matixbridge-server
          path: ${{ runner.temp }}/patched

      - name: Start hbbs/hbbr, a virtual display and the peer
        working-directory: ${{ runner.temp }}
        run: |
          IP=$(hostname -I | awk '{print $1}')
          echo "IP=$IP" >> "$GITHUB_ENV"
          # Our patched hbbs (agents-only) and hbbr, as deployed.
          BIN="$RUNNER_TEMP/patched"
          chmod +x "$BIN/hbbs" "$BIN/hbbr"
          mkdir -p srv && cd srv
          # Peers must reach hbbr via the runner IP, not loopback: hbbr treats loopback TCP as its admin console.
          nohup "$BIN/hbbr" -k _ > hbbr.log 2>&1 &
          sleep 1
          nohup "$BIN/hbbs" -r "$IP:21117" -k _ > hbbs.log 2>&1 &
          for i in $(seq 1 20); do [ -s id_ed25519.pub ] && break; sleep 0.5; done
          if [ ! -s id_ed25519.pub ]; then cat hbbr.log hbbs.log; exit 1; fi
          KEY=$(cat id_ed25519.pub)
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          cd ..
          PASSWORD="e2e-$(openssl rand -hex 8)"
          echo "::add-mask::$PASSWORD"
          echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          mkdir -p ~/.config/rustdesk
          cat > ~/.config/rustdesk/RustDesk2.toml <<EOF
          rendezvous_server = '$IP:21116'
          nat_type = 1
          serial = 0

          [options]
          custom-rendezvous-server = '$IP'
          relay-server = '$IP'
          key = '$KEY'
          approve-mode = 'password'
          verification-method = 'use-permanent-password'
          enable-lan-discovery = 'N'
          EOF
          printf "password = '%s'\n" "$PASSWORD" > ~/.config/rustdesk/RustDesk.toml
          Xvfb :99 -screen 0 1280x800x24 > xvfb.log 2>&1 &
          sleep 1
          export DISPLAY=:99
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          openbox > openbox.log 2>&1 &
          xterm -geometry 160x50+0+0 -fa Monospace -fs 11 -bg '#1e293b' -fg '#e2e8f0' > xterm.log 2>&1 &
          # The peer's connection manager (a Flutter window) handles file operations; give it GL.
          export LIBGL_ALWAYS_SOFTWARE=1
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          XDG_SESSION_TYPE=x11 nohup rustdesk --server > peer.log 2>&1 &
          for i in $(seq 1 120); do
            ID=$(grep -o 'update_pk [0-9]*' srv/hbbs.log | tail -1 | awk '{print $2}')
            [ -n "$ID" ] && break
            sleep 1
          done
          if [ -z "$ID" ]; then
            echo "peer never registered"; ps -ef | grep -i [r]ustdesk
            tail -n 50 peer.log srv/hbbs.log
            find ~/.local/share/logs -type f -exec tail -n 80 {} \; 2>/dev/null
            exit 1
          fi
          echo "Peer registered as $ID"
          echo "ID=$ID" >> "$GITHUB_ENV"

      - name: Protocol smoke test (Node)
        env:
          ID_SERVER: ws://${{ env.IP }}:21118
          RELAY_SERVER: ws://${{ env.IP }}:21119
          WAIT_MS: "6000"
        run: npx tsx scripts/smoke.ts

      - name: Sign-in gate unit tests
        working-directory: matix/server/gate
        run: node --test gate.test.mjs

      - name: Browser test (headless Chromium, through the sign-in gate)
        run: |
          # As in production, the browser reaches hbbs/hbbr only through the gate, which checks the
          # sign-in against agentsUrl's /me (here the script's stand-in for agents.matix.one).
          GATE_ID_UPSTREAM="$IP:21118" GATE_RELAY_UPSTREAM="$IP:21119" GATE_ORIGINS="http://127.0.0.1:4173" \
            GATE_AUTH_URL="http://127.0.0.1:39190/api/v1/matixbridge/me" GATE_PORT=21120 \
            nohup node ../server/gate/gate.mjs > "$RUNNER_TEMP/gate.log" 2>&1 &
          # Production builds read the server and key only from config.json.
          printf '{"idServer":"ws://127.0.0.1:21120/ws/id","relayServer":"ws://127.0.0.1:21120/ws/relay","key":"%s","agentsUrl":"http://127.0.0.1:39190"}\n' "$KEY" > dist/config.json
          npx vite preview --port 4173 --strictPort --host 127.0.0.1 > preview.log 2>&1 &
          sleep 2
          URL="http://127.0.0.1:4173/" SHOT_DIR="$RUNNER_TEMP" TEAM_API_PORT=39190 node scripts/browser-e2e.mjs
          echo "--- gate log"; cat "$RUNNER_TEMP/gate.log"

      - name: File transfer test (Node)
        # The peer serves file operations from its connection-manager window (a Flutter GUI),
        # which does not start on this headless runner, so this step is informational here.
        # It passes against a desktop peer (scripts/files-smoke.ts).
        continue-on-error: true
        env:
          ID_SERVER: ws://${{ env.IP }}:21118
          RELAY_SERVER: ws://${{ env.IP }}:21119
          REMOTE_DIR: /tmp
        run: npx tsx scripts/files-smoke.ts

      - name: Native controllers are refused (agents-only hbbs)
        env:
          HBBR_LOG: ${{ runner.temp }}/srv/hbbr.log
        run: npx tsx scripts/native-refused.ts

      - name: Logs
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          tail -n 40 srv/hbbs.log srv/hbbr.log gate.log || true
          tail -n 80 peer.log || true
          find ~/.local/share/logs/RustDesk -name '*.log' -exec tail -n 60 {} \; 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-*.png
          if-no-files-found: ignore

  e2e-windows:
    # Same client tests against an unmodified RustDesk peer installed on Windows (the main
    # customer platform), plus the block-input / privacy-mode controls.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: matix/web/package-lock.json

      - name: Install and build the web client
        working-directory: matix/web
        run: |
          npm ci
          npm run build
          npm i --no-save playwright@1.49.1
          npx playwright install chromium

      - name: Servers, peer and tests (one step)
        run: |
          # One step on purpose: on Windows the runner kills every process a step started when
          # the step ends, so the servers and the peer must live in the same step as the tests.
          $ErrorActionPreference = 'Stop'
          # Throwaway runner: Windows Firewall blocks the unsigned server binaries otherwise.
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          $env:IP = $ip; "IP=$ip" | Out-File -Append $env:GITHUB_ENV
          Invoke-WebRequest "https://github.com/rustdesk/rustdesk-server/releases/download/$env:SERVER_VERSION/rustdesk-server-windows-x86_64-unsigned.zip" -OutFile server.zip
          Expand-Archive server.zip -DestinationPath server
          $bin = (Get-ChildItem server -Recurse -Filter hbbs.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory srv | Out-Null
          Start-Process "$bin\hbbr.exe" -ArgumentList '-k','_' -WorkingDirectory srv -RedirectStandardOutput srv\hbbr.log -RedirectStandardError srv\hbbr.err
          Start-Sleep 2
          Start-Process "$bin\hbbs.exe" -ArgumentList '-r',"$($ip):21117",'-k','_' -WorkingDirectory srv -RedirectStandardOutput srv\hbbs.log -RedirectStandardError srv\hbbs.err
          for ($i = 0; $i -lt 30 -and -not (Test-Path srv\id_ed25519.pub); $i++) { Start-Sleep 1 }
          $key = (Get-Content srv\id_ed25519.pub -Raw).Trim()
          $env:KEY = $key; "KEY=$key" | Out-File -Append $env:GITHUB_ENV
          Write-Host "server $ip key $key"
          Invoke-WebRequest "https://github.com/rustdesk/rustdesk/releases/download/$env:RUSTDESK_VERSION/rustdesk-$env:RUSTDESK_VERSION-x86_64.msi" -OutFile peer.msi
          Start-Process msiexec.exe -ArgumentList '/i','peer.msi','/qn','/l*v','msi.log' -Wait
          $exe = 'C:\Program Files\RustDesk\rustdesk.exe'
          if (-not (Test-Path $exe)) { Get-Content msi.log -Tail 40; throw "peer not installed" }
          $pw = "e2e-" + [guid]::NewGuid().ToString('N').Substring(0, 12)
          Write-Host "::add-mask::$pw"
          $env:PASSWORD = $pw
          # Run the peer ourselves (like the Linux job) instead of through the installed service,
          # with its config written directly; the service ignores CLI options until it restarts.
          Stop-Service -Name RustDesk -Force -ErrorAction SilentlyContinue
          Get-Process rustdesk -ErrorAction SilentlyContinue | Stop-Process -Force
          $cfg = "$env:APPDATA\RustDesk\config"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          @"
          rendezvous_server = '$($env:IP):21116'
          nat_type = 1
          serial = 0

          [options]
          custom-rendezvous-server = '$($env:IP)'
          relay-server = '$($env:IP)'
          key = '$($env:KEY)'
          approve-mode = 'password'
          verification-method = 'use-permanent-password'
          enable-lan-discovery = 'N'
          "@ -replace '(?m)^          ', '' | Out-File -Encoding ascii "$cfg\RustDesk2.toml"
          "password = '$pw'" | Out-File -Encoding ascii "$cfg\RustDesk.toml"
          Write-Host "--- server sockets"
          Get-NetUDPEndpoint -LocalPort 21116 -ErrorAction SilentlyContinue | Format-Table LocalAddress, LocalPort, OwningProcess
          Get-NetTCPConnection -State Listen -LocalPort 21115,21116,21117,21118,21119 -ErrorAction SilentlyContinue | Format-Table LocalAddress, LocalPort
          Get-NetFirewallProfile | Format-Table Name, Enabled
          Start-Process $exe -ArgumentList '--server' -WorkingDirectory 'C:\Program Files\RustDesk'
          Start-Process notepad.exe
          $id = ''
          for ($i = 0; $i -lt 90 -and -not $id; $i++) {
            if ($i -eq 20) {
              # Fallback: register over loopback in case the server only answers there.
              Write-Host "no registration via $env:IP yet; retrying via 127.0.0.1"
              Get-Process rustdesk -ErrorAction SilentlyContinue | Stop-Process -Force
              (Get-Content "$cfg\RustDesk2.toml") -replace "'$($env:IP)", "'127.0.0.1" | Set-Content -Encoding ascii "$cfg\RustDesk2.toml"
              Start-Process $exe -ArgumentList '--server' -WorkingDirectory 'C:\Program Files\RustDesk'
            }
            Start-Sleep 2
            $m = Select-String -Path srv\hbbs.log,srv\hbbs.err -Pattern 'update_pk (\d+)' -ErrorAction SilentlyContinue | Select-Object -Last 1
            if ($m) { $id = $m.Matches[0].Groups[1].Value }
          }
          if (-not $id) {
            Get-Content srv\hbbs.log,srv\hbbs.err -Tail 30
            Get-Process rustdesk -ErrorAction SilentlyContinue | Format-Table Id, SessionId, Path
            Get-ChildItem "$env:APPDATA\RustDesk\log" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
            throw "peer never registered"
          }
          Write-Host "Peer registered as $id"
          $env:ID = $id
          Write-Host "=== protocol smoke + controls"
          Push-Location matix/web
          $env:ID_SERVER = "ws://$($env:IP):21118"
          $env:RELAY_SERVER = "ws://$($env:IP):21119"
          $env:WAIT_MS = '6000'; $env:CONTROLS = '1'
          npx tsx scripts/smoke.ts; if ($LASTEXITCODE) { throw 'smoke failed' }
          Remove-Item Env:CONTROLS
          Pop-Location
          Write-Host "=== browser"
          Push-Location matix/web
          '{"idServer":"ws://' + $env:IP + ':21118","relayServer":"ws://' + $env:IP + ':21119","key":"' + $env:KEY + '"}' | Out-File -Encoding ascii dist\config.json
          Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js','preview','--port','4173','--strictPort','--host','127.0.0.1' -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-WebRequest http://127.0.0.1:4173/ -UseBasicParsing -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep 1 } }
          $env:URL = "http://127.0.0.1:4173/"
          $env:SHOT_DIR = $env:RUNNER_TEMP
          node scripts/browser-e2e.mjs; if ($LASTEXITCODE) { throw 'browser test failed' }
          Pop-Location
          Write-Host "=== file transfer (informational)"
          Push-Location matix/web
          $env:ID_SERVER = "ws://$($env:IP):21118"
          $env:RELAY_SERVER = "ws://$($env:IP):21119"
          $env:REMOTE_DIR = "C:\Windows\Temp"
          npx tsx scripts/files-smoke.ts; if ($LASTEXITCODE) { Write-Host '::warning::file transfer test failed' }
          Pop-Location

      - name: Logs
        if: always()
        run: |
          Get-Content srv\hbbs.log,srv\hbbs.err -Tail 30 -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log","$env:APPDATA\RustDesk\log" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-windows-screenshots
          path: ${{ runner.temp }}/e2e-*.png
          if-no-files-found: ignore
