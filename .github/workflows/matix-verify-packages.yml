name: Matix verify packages

# Installs a published MatixBridge release on a clean Windows machine and checks what a
# customer gets: names, shortcuts, uninstall entry, and that the app starts.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify"
        required: true
        default: "matixbridge-v0.3"

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: src
          sparse-checkout: matix/brand
      - name: Install the MSI and check the result
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p 'MatixBridge-*-x86_64.msi' -O setup.msi
          $p = Start-Process msiexec.exe -ArgumentList '/i','setup.msi','/qn','/l*v','msi.log' -Wait -PassThru
          Write-Host "msiexec exit code: $($p.ExitCode)"
          $fail = @()
          function Check($what, $ok) { if ($ok) { Write-Host "OK   $what" } else { Write-Host "FAIL $what"; $script:fail += $what } }

          $dir = 'C:\Program Files\MatixBridge'
          Check "installed to $dir" (Test-Path "$dir\MatixBridge.exe")
          $desk = @("$env:PUBLIC\Desktop\MatixBridge.lnk", "$env:USERPROFILE\Desktop\MatixBridge.lnk") | Where-Object { Test-Path $_ }
          Check "desktop shortcut" ($desk.Count -gt 0)
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs","$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'MatixBridge*.lnk' -ErrorAction SilentlyContinue
          Check "start menu shortcut" ($menu.Count -gt 0)
          $menu | ForEach-Object { Write-Host "     $($_.FullName)" }
          $desk | ForEach-Object {
            $t = (New-Object -ComObject WScript.Shell).CreateShortcut($_).TargetPath
            Write-Host "     $_ -> $t"
            Check "desktop shortcut targets MatixBridge.exe" ($t -like '*MatixBridge.exe')
          }
          $arp = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like 'MatixBridge*' }
          Check "Add/Remove Programs entry named MatixBridge" ($arp -ne $null)
          $arp | ForEach-Object { Write-Host "     $($_.DisplayName) $($_.DisplayVersion) by $($_.Publisher)" }
          $rd = Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like '*RustDesk*' }
          Check "no RustDesk entry" ($rd -eq $null)
          $svc = Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*MatixBridge*' -or $_.DisplayName -like '*MatixBridge*' -or $_.Name -like '*RustDesk*' }
          $svc | ForEach-Object { Write-Host "     service: $($_.Name) / $($_.DisplayName) ($($_.Status))" }
          Check "service named MatixBridge" (($svc | Where-Object { $_.DisplayName -like '*MatixBridge*' }) -ne $null)
          Start-Sleep 5
          $proc = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -like '*MatixBridge*' }
          $proc | ForEach-Object { Write-Host "     running: $($_.ProcessName) $($_.Path)" }
          Check "MatixBridge process running" ($proc -ne $null)
          # The exe's icon resources hold the .ico's PNG images byte for byte.
          $py = @'
          import struct, sys
          ico = open(sys.argv[1], "rb").read(); exe = open(sys.argv[2], "rb").read()
          n = struct.unpack("<HHH", ico[:6])[2]
          print(sum(ico[o:o + s] in exe for s, o in (struct.unpack("<II", ico[14 + 16 * i:22 + 16 * i]) for i in range(n))), n)
          '@
          $py | Set-Content icon_check.py
          $r = (python icon_check.py src\matix\brand\assets\flutter\windows\runner\resources\app_icon.ico "$dir\MatixBridge.exe").Trim().Split(' ')
          Write-Host "     Matix icon images found in MatixBridge.exe: $($r[0]) of $($r[1])"
          Check "MatixBridge.exe has the Matix icon" ($r[0] -eq $r[1] -and [int]$r[1] -gt 0)
          if ($fail.Count) { Get-Content msi.log -Tail 30; throw "Failed: $($fail -join ', ')" }

      - name: Screenshot of the customer window
        # For a person to look at: since v0.5 the window is receive-only (ID and password, no
        # "connect to" box).
        run: |
          Start-Process 'C:\Program Files\MatixBridge\MatixBridge.exe'
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\matixbridge-window.png")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-window
          path: ${{ runner.temp }}/matixbridge-window.png
          if-no-files-found: ignore

  macos-dmg:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: src
          sparse-checkout: matix/brand
      - name: Check both DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          for arch in aarch64 x86_64; do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "MatixBridge-*-$arch.dmg" -O "$arch.dmg"
            m=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$m" "$arch.dmg" >/dev/null
            app="$m/MatixBridge.app"
            test -d "$app" || { echo "FAIL $arch: no MatixBridge.app"; ls "$m"; exit 1; }
            name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$app/Contents/Info.plist")
            exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
            archs=$(lipo -archs "$app/Contents/MacOS/$exe")
            codesign --verify --deep --strict "$app"
            echo "OK   $arch.dmg: $name ($exe) archs=[$archs] signature valid, volume=$(diskutil info "$m" | awk -F': *' '/Volume Name/{print $2}')"
            want=$([ "$arch" = aarch64 ] && echo arm64 || echo x86_64)
            [ "$archs" = "$want" ] || { echo "FAIL $arch: expected $want"; exit 1; }
            icon=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$app/Contents/Info.plist")
            icon="$app/Contents/Resources/${icon%.icns}.icns"
            if cmp -s "$icon" src/matix/brand/assets/flutter/macos/Runner/AppIcon.icns; then echo "OK   $arch.dmg: Matix app icon"; else echo "FAIL $arch: app icon is not the Matix icon ($icon)"; exit 1; fi
            hdiutil detach "$m" >/dev/null
          done

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: src
          sparse-checkout: matix/brand
      - name: Check every APK carries the Matix launcher icon
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          want=$(sha256sum src/matix/brand/assets/flutter/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | cut -d' ' -f1)
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'MatixBridge-*.apk'
          fail=0
          for apk in MatixBridge-*.apk; do
            d=$(mktemp -d); unzip -q "$apk" 'res/*' -d "$d"
            if find "$d/res" -name '*.png' -exec sha256sum {} + | grep "^$want " >/dev/null; then echo "OK   $apk: Matix launcher icon"; else echo "FAIL $apk: Matix launcher icon not found"; fail=1; fi
          done
          exit $fail
