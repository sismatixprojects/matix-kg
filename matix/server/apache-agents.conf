# MatixBridge on agents.matix.one (cPanel account agentsmatix), userdata include
# /etc/apache2/conf.d/userdata/ssl/2_4/agentsmatix/agents.matix.one/matixbridge.conf
# Apply with /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd.
# Needs mod_alias, mod_proxy, mod_proxy_wstunnel, mod_headers.
#
# The web client lives outside public_html (/opt/matix-kg/web), so rebuilding the portal into
# public_html never touches it, and public_html's React .htaccess does not apply to it.
Alias /bridge /opt/matix-kg/web
<Directory /opt/matix-kg/web>
    Require all granted
    Options -Indexes
    AllowOverride None
</Directory>
RedirectMatch 301 ^/bridge$ /bridge/

# WebSockets to hbbs/hbbr go through the sign-in gate (gate/gate.mjs, systemd matixbridge-gate),
# which lets only signed-in Matix staff through. ProxyPass is matched before the Alias above.
ProxyPass /bridge/ws/id ws://127.0.0.1:21120/ws/id timeout=3600
ProxyPass /bridge/ws/relay ws://127.0.0.1:21120/ws/relay timeout=3600
<Location /bridge/ws/>
    # hbbs/hbbr read the client address from X-Real-IP (the vhost sets it to REMOTE_ADDR,
    # which is Cloudflare's address when the site is proxied).
    RequestHeader set X-Real-IP "%{CF-Connecting-IP}i" "expr=-n %{req:CF-Connecting-IP}"
</Location>
