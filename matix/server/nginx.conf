# nginx site for MatixBridge: the web client at /web/ and TLS WebSocket proxies to hbbs/hbbr.
# Certificates: e.g. certbot --nginx -d bridge.matix.one
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 443 ssl http2;
    server_name bridge.matix.one;
    ssl_certificate     /etc/letsencrypt/live/bridge.matix.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.matix.one/privkey.pem;

    location = / { return 302 /web/; }

    # npm run build output (matix/web/dist) plus config.json
    location /web/ {
        alias /var/www/matix-kg/web/;
        try_files $uri $uri/ /web/index.html;
        add_header Cache-Control "no-cache" always;
        location ~* /web/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    }

    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;          # overwrite: hbbs trusts this header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 80;
    server_name bridge.matix.one;
    return 301 https://$host$request_uri;
}
