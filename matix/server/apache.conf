# Apache (cPanel userdata include) equivalent of nginx.conf. This is what runs for
# kg.matix.one: /etc/apache2/conf.d/userdata/{std,ssl}/2_4/kgmatix/kg.matix.one/matixkg.conf
# then /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd.
# Needs mod_proxy, mod_proxy_wstunnel, mod_headers, mod_remoteip.
RemoteIPHeader CF-Connecting-IP
# hbbs/hbbr trust X-Real-IP; always overwrite it with the real client address.
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
ProxyPass /ws/id ws://127.0.0.1:21118/ timeout=3600
ProxyPass /ws/relay ws://127.0.0.1:21119/ timeout=3600
RedirectMatch 302 ^/$ /web/
# The web client (matix/web/dist + config.json) lives in public_html/web/.
