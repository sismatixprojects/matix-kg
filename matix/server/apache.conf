# bridge.matix.one and kg.matix.one: cPanel account kgmatix, userdata include
# /etc/apache2/conf.d/userdata/{std,ssl}/2_4/kgmatix/kg.matix.one/matixkg.conf
# (bridge.matix.one is a parked domain on the same vhost).
# Closed since 2026-11-13: MatixBridge is served by agents.matix.one at /bridge/ (apache-agents.conf).
# Every request goes there; no WebSockets are proxied from these names any more.
# Apply with /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd.
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://agents.matix.one/bridge/ [R=302,L]
