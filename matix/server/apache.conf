# Apache (cPanel userdata include) equivalent of nginx.conf; this is what runs in production:
# /etc/apache2/conf.d/userdata/{std,ssl}/2_4/kgmatix/kg.matix.one/matixkg.conf
# bridge.matix.one is a parked domain on the kgmatix account (same vhost).
# Apply with /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd.
# Needs mod_proxy, mod_proxy_wstunnel, mod_headers, mod_remoteip, mod_rewrite.
# MatixBridge (formerly Matix KG). Serves bridge.matix.one (main) and kg.matix.one (old name, redirects).
# Web client in public_html/web, WebSockets to hbbs/hbbr (systemd matix-kg-hbbs/hbbr).
RemoteIPHeader CF-Connecting-IP
# hbbs/hbbr trust X-Real-IP; always overwrite it with the real client address.
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
# WebSockets go through the sign-in gate (gate/gate.mjs, systemd matixbridge-gate on :21120),
# which passes only signed-in Matix staff on to hbbs :21118 and hbbr :21119.
ProxyPass /ws/id ws://127.0.0.1:21120/ws/id timeout=3600
ProxyPass /ws/relay ws://127.0.0.1:21120/ws/relay timeout=3600
RewriteEngine On
RewriteCond %{HTTP_HOST} ^kg\.matix\.one$ [NC]
RewriteCond %{REQUEST_URI} !^/(ws/|\.well-known/)
RewriteRule ^/?(.*)$ https://bridge.matix.one/$1 [R=301,L]
RedirectMatch 302 ^/$ /web/
