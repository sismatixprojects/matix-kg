# Apache (e.g. cPanel userdata include) equivalent of nginx.conf.
# Needs mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers.
RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
ProxyTimeout 3600
ProxyPass        /ws/id    ws://127.0.0.1:21118/ timeout=3600
ProxyPassReverse /ws/id    ws://127.0.0.1:21118/
ProxyPass        /ws/relay ws://127.0.0.1:21119/ timeout=3600
ProxyPassReverse /ws/relay ws://127.0.0.1:21119/
# Serve matix/web/dist (with config.json) from the document root's web/ folder.
